services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - webnet
    # No published ports: reachable only as searxng:8080 on webnet (2026-08-24)
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/  # internal webnet DNS (2026-08-24)
      - SEARXNG_SECRET=${SEARXNG_SECRET}       # from root .env — overrides the (absent) secret_key in settings.yml
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
