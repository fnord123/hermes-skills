name: conventions

# A convention nobody checks is a convention that decays. The first audit of this repo found
# 16 of 16 skills non-conformant, including the skill CONVENTIONS.md nominates as the template
# to copy. Nothing had ever looked.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Lint skills against CONVENTIONS.md
        # Exits 1 on any critical finding: a broken install (undeclared imports) or broken
        # routing (no PREFER clause / trigger list). Majors and minors are reported but do
        # not fail the build yet - see the baseline in tools/lint_skills.py's commit message.
        run: python3 tools/lint_skills.py
      - name: Linter self-test (negative battery)
        # 59 cases mutate a compliant skill in exactly one way each and assert which rules
        # fire and which must not. A linter that only passes on clean inputs is a promise,
        # not a mechanism - this is what keeps the audit fixes from rotting (2026-08-27).
        run: python3 tools/test_lint_skills.py
      - name: Vendored copies match their source
        # A skill must be self-contained for `hermes skills install`, so shared modules are
        # copied into each scripts/ dir rather than symlinked. Copies drift - one did within
        # hours of being created - so the build fails when they do.
        run: python3 tools/vendor.py check
