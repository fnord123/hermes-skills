# webaccess — non-secret deploy DEFAULTS (baked into the image at build).
#
# Consumed by run_service.py at boot. Precedence: the process env set by
# docker compose (environment: / env_file .env) is authoritative — a key
# the caller already provides, even set empty, wins over the baked
# default. Everything here is configuration, not credentials; the only
# runtime secret (the LiteLLM key) comes from .env and is never committed.
#
# Keys that have a correct hardcoded fallback in code (WEBACCESS_PORT,
# WEBACCESS_MCP_PORT, WEBACCESS_HOME, FARA_HOME, BLADEBRO_*) need no
# entry here. Add one only to override.

env:
  # Self-hosted SearXNG — internal service name (post 2026-08-24 internal
  # network; the old host-published URL must not come back).
  SEARXNG_URL: http://searxng:8080
  # Self-hosted Firecrawl — internal service name for the render rung.
  FIRECRAWL_API_URL: http://firecrawl:3002
  # Loki push for fetch-event metrics — internal service name.
  RX_LOKI_URL: http://loki:3100/loki/api/v1/push
